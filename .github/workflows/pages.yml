name: Publish Clockface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Stage app files
        run: |
          mkdir -p web-stage/clockface
          cp main.py web-stage/clockface/
          cp -R src web-stage/clockface/
          cp -R assets web-stage/clockface/
          cp config.yaml web-stage/clockface/ 2>/dev/null || true
          cp config_*.yaml web-stage/clockface/ 2>/dev/null || true

      - name: Build browser app
        run: pygbag --build --disable-sound-format-error web-stage/clockface

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-stage/clockface/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4