# Optional title displayed in a large goofy font above the clock.
title: "Den automatiske lektiefar"

# End of the countdown period, "HH:MM" (today, 24h clock).
# If omitted, defaults to current time + total_time.
# end_time: "7:40"

# Duration of the countdown timer in minutes (max: 60, default: 60).
total_time: 30

# Played on SPACE when no slot is currently active.
fallback_sound: "assets/sounds/fister2.wav"

# Played repeatedly (every 5-20s, at random) for 5 minutes after end_time.
siren_sound: "assets/sounds/afsted.wav"

# Slots are only shown during the last hour before end_time.
# start/end are minutes before end_time (60 = 1 hour before, 0 = at end_time).
# Each slot's image is placed outside the clock face at its midpoint time.
# Pressing SPACE plays the sound of whichever slot's start/end contains "now".
slots:
  - start: 60
    end: 0
    image: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeHlibnpiNXp1NmVsMHRvODYydjN2a25vYzJzaW1nb2J3ZWFseXhxcSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NFA61GS9qKZ68/giphy.gif"
    sound: "assets/sounds/laes.wav"
